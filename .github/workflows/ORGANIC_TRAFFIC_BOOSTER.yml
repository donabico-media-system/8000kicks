name: ORGANIC_TRAFFIC_BOOSTER

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Protocols/**'
      - '.github/workflows/ORGANIC_TRAFFIC_BOOSTER.yml'
      - 'Build_Engine.js'
  repository_dispatch:
    types: [eseb_f12_log_stream, eseb_multi_protocol_pulse]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  execute-eseb-seo-geo-dynamic:
    name: "Execute ESEB SEO GEO DYNAMIC Protocol Engine"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ESEB_CLASSIC_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Save Client Payload Buffer
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload_buffer.json

      - name: Execute Build Engine Node.js
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node Build_Engine.js

      - name: Force Commit and Push All ESEB Assets
        env:
          AUTH_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git add -f Protocols/
          git add LOG_HISTORY.json sitemap.xml llms.txt llms-full.txt feed.xml feed.json *.html eseb2424242424242424242424242424.txt Build_Engine.js || true
          
          if ! git diff --staged --quiet; then
            git commit -m "ESEB-CORE: Hard Seal & Sync ESEB Protocols [V-STAMP-24]"
            git remote set-url origin "https://x-access-token:${AUTH_TOKEN}@github.com/${{ github.repository }}.git"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Zero entropy preserved. No changes detected."
          fi
