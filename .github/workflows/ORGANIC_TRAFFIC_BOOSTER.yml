name: ORGANIC_TRAFFIC_BOOSTER

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Protocols/**'
      - '.github/workflows/ORGANIC_TRAFFIC_BOOSTER.yml'
  repository_dispatch:
    types: [eseb_f12_log_stream, eseb_multi_protocol_pulse]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-eseb-seo-geo-dynamic:
    name: "Execute ESEB SEO GEO DYNAMIC Protocol Engine"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ESEB_CLASSIC_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Save Client Payload Buffer
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload_buffer.json

      - name: Compile .eseb to .ehc
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const protoDir = "Protocols";
          if (fs.existsSync(protoDir)) {
            const files = fs.readdirSync(protoDir);
            files.forEach(file => {
              if (file.endsWith(".eseb")) {
                const esebContent = fs.readFileSync(path.join(protoDir, file), "utf8");
                const match = esebContent.match(/return \`([\s\S]*?)\`;/);
                if (match) {
                  const ehcCode = match[1]
                    .replace(/\${this\.config\.stamp}/g, "V-STAMP-24")
                    .replace(/\${this\.config\.bufferInterval}/g, "2500");
                  const targetEhc = path.join(protoDir, file.replace(".eseb", ".ehc"));
                  fs.writeFileSync(targetEhc, ehcCode);
                  console.log(`[ESEB COMPILER] Compiled ${file} -> ${targetEhc}`);
                }
              }
            });
          }
          '

      - name: Execute ESEB SEO GEO DYNAMIC Multi-Module Generator
        env:
          GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
          ESEB_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const fullRepoPath = process.env.GITHUB_REPOSITORY || "donabico-media-system/core-node";
          const orgName = fullRepoPath.split("/")[0] || "donabico-media-system";
          const repoName = fullRepoPath.split("/")[1] || "core-node";
          const domainHost = `${orgName}.github.io`;

          const historyFile = "LOG_HISTORY.json";
          let historyData = {
            entity_name: "ESEB_SEO_GEO_DYNAMIC_ENTITY",
            organization: orgName.toUpperCase(),
            domain: domainHost,
            repo_node: repoName,
            stamp: "V-STAMP-24",
            anchor: "¢24",
            vital_signs: { status: "ALIVE_AND_PERPETUAL", entropy: "0.00000000000000", heartbeat_bpm: 24 },
            total_pulses_recorded: 0,
            history_logs: []
          };

          if (fs.existsSync(historyFile)) {
            try { historyData = JSON.parse(fs.readFileSync(historyFile, "utf8")); } catch(e) {}
          }

          if (fs.existsSync("payload_buffer.json")) {
            try {
              const payloadContent = fs.readFileSync("payload_buffer.json", "utf8").trim();
              if (payloadContent && payloadContent !== "null") {
                const eventPayload = JSON.parse(payloadContent);
                if (eventPayload && eventPayload.logs && Array.isArray(eventPayload.logs)) {
                  historyData.total_pulses_recorded += eventPayload.logs.length;
                  historyData.vital_signs.heartbeat_bpm = Math.floor(Math.random() * (28 - 22 + 1)) + 22;
                  historyData.history_logs = [...eventPayload.logs, ...historyData.history_logs].slice(0, 100);
                }
              }
            } catch(e) {}
            try { fs.unlinkSync("payload_buffer.json"); } catch(e) {}
          }

          fs.writeFileSync(historyFile, JSON.stringify(historyData, null, 2));

          const pseoTopics = [
            { slug: `${repoName}-official-review`, title: `${repoName.toUpperCase()} Official Review 2026`, desc: `Comprehensive performance analysis and direct buyer guide for ${repoName}.` },
            { slug: `best-${repoName}-eco-guide`, title: `Top Eco Footwear & Gear Guide - ${repoName.toUpperCase()}`, desc: `Why sustainable materials make ${repoName} the premier travel choice.` },
            { slug: `${repoName}-waterproof-durability`, title: `${repoName.toUpperCase()} Extreme Waterproof Durability Test`, desc: `In-depth waterproof testing and hemp fabric resilience in real conditions.` }
          ];

          let allUrls = [`https://${domainHost}/${repoName}.html`, `https://${domainHost}/`];

          pseoTopics.forEach(topic => {
            const fileName = `${topic.slug}.html`;
            const pageUrl = `https://${domainHost}/${fileName}`;
            allUrls.push(pageUrl);

            const pseoHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>${topic.title} | DONABICO GLOBAL MEDIA SYSTEM</title>
  <meta name="description" content="${topic.desc}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="${topic.title}">
  <meta property="og:description" content="${topic.desc}">
  <meta property="og:type" content="product">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="preconnect" href="https://api.indexnow.org">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "${topic.title}",
    "description": "${topic.desc}",
    "brand": { "@type": "Brand", "name": "DONABICO GLOBAL MEDIA SYSTEM" },
    "offers": {
      "@type": "Offer",
      "priceCurrency": "USD",
      "price": "99.00",
      "availability": "https://schema.org/InStock",
      "url": "${pageUrl}"
    }
  }
  </script>
</head>
<body style="background:#0d1117; color:#c9d1d9; font-family:sans-serif; padding:40px; line-height:1.6; max-width:800px; margin:0 auto;">
  <h1 style="color:#00FF66; border-bottom:1px solid #30363d; padding-bottom:10px;">${topic.title}</h1>
  <p style="font-size:18px; color:#8b949e;">${topic.desc}</p>
  <hr style="border-color:#30363d; margin:30px 0;">
  <p style="font-size:12px; color:#484f58;">ESEB SEO GEO DYNAMIC Node Active. Stamp: V-STAMP-24</p>
  <!-- ZONE 2: ESEB BRIDGE -->
  <script src="./Protocols/Organic_Traffic_Booster.ehc" id="Organic_Traffic_Booster-Bridge" data-module="Organic_Traffic_Booster" async></script>
</body>
</html>`;
            fs.writeFileSync(fileName, pseoHtml);
          });

          const llmsTxtContent = `# ${repoName.toUpperCase()} - DONABICO GLOBAL MEDIA SYSTEM\n> ESEB SEO GEO DYNAMIC Autonomous Protocol Node\n\n## Core Overview\nOfficial ESEB node operating under DONABICO GLOBAL MEDIA MESH.\nFeatures eco-friendly products, sustainable materials, and direct affiliate routing.\n\n## Primary Product Links\n- Main Showcase: https://${domainHost}/${repoName}.html\n- Official Network Hub: https://${domainHost}/\n\n## pSEO Sub-Pages\n${allUrls.map(u => `- ${u}`).join("\n")}\n`;
          fs.writeFileSync("llms.txt", llmsTxtContent);
          fs.writeFileSync("llms-full.txt", llmsTxtContent + "\n\n## Full Protocol Context\nEngineered with ESEB V3000-Ω. Stamp: V-STAMP-24.");

          const today = new Date().toUTCString();
          const rssFeedXml = `<?xml version="1.0" encoding="UTF-8" ?>\n<rss version="2.0">\n<channel>\n  <title>${repoName.toUpperCase()} | DONABICO GLOBAL MEDIA SYSTEM</title>\n  <link>https://${domainHost}/</link>\n  <description>ESEB SEO GEO DYNAMIC Syndication Feed</description>\n  <lastBuildDate>${today}</lastBuildDate>\n  ${pseoTopics.map(t => `\n  <item>\n    <title>${t.title}</title>\n    <link>https://${domainHost}/${t.slug}.html</link>\n    <description>${t.desc}</description>\n    <pubDate>${today}</pubDate>\n  </item>`).join("")}\n</channel>\n</rss>`;
          fs.writeFileSync("feed.xml", rssFeedXml);

          const jsonFeedData = {
            version: "https://jsonfeed.org/version/1.1",
            title: `${repoName.toUpperCase()} Feed`,
            home_page_url: `https://${domainHost}/`,
            feed_url: `https://${domainHost}/feed.json`,
            items: pseoTopics.map((t, idx) => ({
              id: `${idx + 1}`,
              url: `https://${domainHost}/${t.slug}.html`,
              title: t.title,
              content_text: t.desc,
              date_published: new Date().toISOString()
            }))
          };
          fs.writeFileSync("feed.json", JSON.stringify(jsonFeedData, null, 2));

          const todayISO = new Date().toISOString().split('T')[0];
          let sitemapXml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;
          allUrls.forEach(u => {
            sitemapXml += `  <url><loc>${u}</loc><lastmod>${todayISO}</lastmod><changefreq>hourly</changefreq><priority>1.0</priority></url>\n`;
          });
          sitemapXml += `</urlset>`;
          fs.writeFileSync("sitemap.xml", sitemapXml);

          const indexNowKey = "eseb2424242424242424242424242424";
          const keyFileName = `${indexNowKey}.txt`;
          if (!fs.existsSync(keyFileName)) fs.writeFileSync(keyFileName, indexNowKey);

          const indexNowData = JSON.stringify({
            host: domainHost,
            key: indexNowKey,
            keyLocation: `https://${domainHost}/${keyFileName}`,
            urlList: allUrls
          });

          const indexReq = https.request({
            hostname: "www.bing.com", path: "/indexnow", method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8", "Content-Length": Buffer.byteLength(indexNowData) }
          }, (res) => {
            console.log(`[INDEXNOW BROADCAST] Status: ${res.statusCode}`);
          });
          indexReq.on("error", (e) => console.error(e));
          indexReq.write(indexNowData);
          indexReq.end();
          '

      - name: Safe Auto-Commit & Push (Strict ESEB State)
        env:
          GH_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -f Protocols/Organic_Traffic_Booster.eseb Protocols/Organic_Traffic_Booster.ehc || true
          git add LOG_HISTORY.json sitemap.xml llms.txt llms-full.txt feed.xml feed.json *.html eseb2424242424242424242424242424.txt || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "ESEB-CORE: Fix YAML & Sync ESEB SEO GEO DYNAMIC [V-STAMP-24]"
            git set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" || true
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          else
            echo "Zero entropy preserved. No changes to commit."
          fi
