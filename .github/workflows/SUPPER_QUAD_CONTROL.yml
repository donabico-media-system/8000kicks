name: SUPPER_QUAD_CONTROL

on:
  push:
    paths:
      - 'Protocols/*.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  eseb-supper-quad-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile ESEB Protocol (.eseb -> .ehc + .js)
        run: |
          python Protocols/Supper_Quad_Control.eseb

      - name: Execute Serverless Runner Dual-Token Engine
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
        run: |
          node Protocols/Supper_Quad_Control.js

      - name: Conflict-Free Git Commit & Push Strategy
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Protocols/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(eseb): auto-compile dual-token supper quad living entities [V-STAMP-24]"
            git pull --rebase origin main || git rebase --skip
            git push origin HEAD:main
          else
            echo "No changes detected. Skipping commit."
          fi
