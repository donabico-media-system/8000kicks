name: SUPER_QUAD_CONTROL

on:
  push:
    paths:
      - 'Protocols/Super_Quad_Control.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eseb-hash-sharded-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Hash Sharded Protocol (.eseb -> .ehc + .js)
        run: |
          python3 Protocols/Super_Quad_Control.eseb

      - name: Execute Hash Sharded 24-Thread Swarm & Self-Healing Engine
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          node Protocols/Super_Quad_Control.js

      - name: Safe Conflict-Free Git Commit & Push Strategy
        if: success()
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add Protocols/
          if ! git diff --cached --quiet; then
            git commit -m "chore(eseb-sota): hash-sharded 24-thread virtual orchestration artifacts [V-STAMP-24]"
            git fetch origin main --prune
            git rebase origin/main || git rebase --abort || true
            git push origin HEAD:main --force-with-lease
          else
            echo "No changes detected. Skipping commit."
          fi
