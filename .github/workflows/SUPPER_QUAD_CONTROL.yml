name: SUPER_QUAD_CONTROL

on:
  push:
    paths:
      - 'Protocols/Super_Quad_Control.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eseb-super-quad-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile ESEB Protocol (.eseb -> .ehc + .js)
        run: |
          python3 Protocols/Super_Quad_Control.eseb

      - name: Execute Serverless Dual-Token Engine
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
        run: |
          node Protocols/Super_Quad_Control.js

      - name: Conflict-Free Git Commit & Push Strategy
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add Protocols/
          if ! git diff --cached --quiet; then
            git commit -m "chore(eseb): auto-compile Super_Quad_Control artifacts [V-STAMP-24]"
            git fetch origin main
            git rebase origin/main || git rebase --skip || true
            git push origin HEAD:main
          else
            echo "No changes detected. Skipping commit."
          fi
