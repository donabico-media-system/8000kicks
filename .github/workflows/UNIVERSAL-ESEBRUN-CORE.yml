name: UNIVERSAL-ESEBRUN-CORE

on:
  push:
    paths:
      - 'Protocols/Universal-Esebrun-Core.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eseb-compile-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Execute SOTA Groq AI Handshake
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "[V-STAMP-24] Cài đặt thư viện SDK SOTA và khởi động kết nối Groq AI..."
          pip install --quiet groq

          python3 - <<'EOF'
          import os
          from groq import Groq

          api_key = os.getenv("API_GROQ_TOKEN")
          if not api_key:
              print("[ERROR] API_GROQ_TOKEN không tồn tại trong môi trường vault.")
              exit(1)

          try:
              # Khởi tạo client chính thức của Groq (Bypass Cloudflare WAF qua SDK SOTA)
              client = Groq(api_key=api_key)
              
              # Gửi gói tin Handshake thực tế tới mô hình SOTA
              response = client.chat.completions.create(
                  model="llama-3.3-70b-versatile",
                  messages=[
                      {"role": "system", "content": "DONABICO GLOBAL MEDIA SYSTEM - SOTA Protocol Active."},
                      {"role": "user", "content": "Ping Handshake Test. Reply OK."}
                  ],
                  max_tokens=10
              )
              
              reply = response.choices[0].message.content.strip()
              print(f"[SUCCESS] Groq AI SOTA Handshake thành công! Phản hồi từ máy chủ: {reply}")
              
          except Exception as e:
              print(f"[ERROR] Lỗi kết nối SOTA Groq API: {e}")
              exit(1)

          # Biên dịch tệp Living Entity an toàn tuyệt đối (Zero-Exposure)
          os.makedirs("Protocols", exist_ok=True)
          if os.path.exists("Protocols/Universal-Esebrun-Core.eseb"):
              with open("Protocols/Universal-Esebrun-Core.eseb", "r", encoding="utf-8") as f:
                  content = f.read()
              with open("Protocols/Universal-Esebrun-Core.ehc", "w", encoding="utf-8") as f:
                  f.write(content)
              print("[SUCCESS] Đã biên dịch xong Protocols/Universal-Esebrun-Core.ehc chuẩn SOTA.")
          else:
              print("[ERROR] Không tìm thấy tệp nguồn .eseb")
              exit(1)
          EOF

      - name: Commit and Push Living Entity Bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compiled Universal-Esebrun-Core.ehc with Official Groq SOTA SDK [V-STAMP-24]"
          file_pattern: "Protocols/Universal-Esebrun-Core.ehc"
