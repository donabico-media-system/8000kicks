name: UNIVERSAL-ESEBRUN-CORE

on:
  push:
    paths:
      - 'Protocols/Universal-Esebrun-Core.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eseb-compile-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Real AI Handshake & Compilation
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os
          import urllib.request
          import json

          print("[V-STAMP-24] Bắt đầu tiến trình xác thực thực tế các API AI...")

          tokens = {
              "API_GROQ_TOKEN": os.getenv("API_GROQ_TOKEN"),
              "ESEB_CLASSIC_TOKEN": os.getenv("ESEB_CLASSIC_TOKEN"),
              "LLAMA_NVIDIA_TOKEN": os.getenv("LLAMA_NVIDIA_TOKEN"),
              "NEMOTRON_NVIDIA_TOKEN": os.getenv("NEMOTRON_NVIDIA_TOKEN")
          }

          # Kiểm tra xem có token nào bị trống không
          missing = [k for k, v in tokens.items() if not v]
          if missing:
              print(f"[ERROR] Thiếu các Secret sau: {missing}")
              exit(1)

          # Thực hiện kết nối thực tế tới Groq API để kiểm tra phản hồi từ máy chủ
          url = "https://api.groq.com/openai/v1/models"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tokens['API_GROQ_TOKEN']}"})
          
          try:
              with urllib.request.urlopen(req) as response:
                  if response.status == 200:
                      print("[SUCCESS] Groq AI Handshake thành công! Máy chủ đã xác thực phản hồi (HTTP 200).")
                  else:
                      print(f"[WARNING] Groq phản hồi mã trạng thái: {response.status}")
          except Exception as e:
              print(f"[ERROR] Lỗi kết nối thực tế tới Groq API: {e}")
              exit(1)

          # Biên dịch tệp Living Entity sạch sẽ (Zero-Exposure)
          os.makedirs("Protocols", exist_ok=True)
          if os.path.exists("Protocols/Universal-Esebrun-Core.eseb"):
              with open("Protocols/Universal-Esebrun-Core.eseb", "r", encoding="utf-8") as f:
                  content = f.read()
              with open("Protocols/Universal-Esebrun-Core.ehc", "w", encoding="utf-8") as f:
                  f.write(content)
              print("[SUCCESS] Đã biên dịch xong Protocols/Universal-Esebrun-Core.ehc an toàn tuyệt đối.")
          else:
              print("[ERROR] Không tìm thấy file nguồn .eseb")
              exit(1)
          EOF

      - name: Commit and Push Living Entity Bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compiled Universal-Esebrun-Core.ehc with Real Python AI Handshake [V-STAMP-24]"
          file_pattern: "Protocols/Universal-Esebrun-Core.ehc"
