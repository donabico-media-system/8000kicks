name: UNIVERSAL-ESEBRUN-CORE

on:
  push:
    paths:
      - 'Protocols/Universal-Esebrun-Core.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eseb-compile-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Secrets and Compile ESEB Living Entity
        env:
          API_CLASSIC_TOKEN: ${{ secrets.API_CLASSIC_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "[V-STAMP-24] Injecting 04 Live API Secrets into ESEB Core for DONABICO GLOBAL MEDIA SYSTEM"
          mkdir -p Protocols
          
          if [ -f "Protocols/Universal-Esebrun-Core.eseb" ]; then
            cp Protocols/Universal-Esebrun-Core.eseb Protocols/Universal-Esebrun-Core.ehc
            
            # Thay thế các placeholder trong tệp .ehc bằng 04 Secret thực tế từ kho
            sed -i "s|__API_CLASSIC_TOKEN__|${API_CLASSIC_TOKEN}|g" Protocols/Universal-Esebrun-Core.ehc
            sed -i "s|__ESEB_CLASSIC_TOKEN__|${ESEB_CLASSIC_TOKEN}|g" Protocols/Universal-Esebrun-Core.ehc
            sed -i "s|__LLAMA_NVIDIA_TOKEN__|${LLAMA_NVIDIA_TOKEN}|g" Protocols/Universal-Esebrun-Core.ehc
            sed -i "s|__NEMOTRON_NVIDIA_TOKEN__|${NEMOTRON_NVIDIA_TOKEN}|g" Protocols/Universal-Esebrun-Core.ehc

            echo "[SUCCESS] Generated Protocols/Universal-Esebrun-Core.ehc with 04 Real Secrets Injected & Zero Entropy Delta."
          else
            echo "[ERROR] Protocols/Universal-Esebrun-Core.eseb source not found."
            exit 1
          fi

      - name: Commit and Push Living Entity Bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compiled Universal-Esebrun-Core.ehc with 04 Live Secrets Injected [V-STAMP-24]"
          file_pattern: "Protocols/Universal-Esebrun-Core.ehc"
