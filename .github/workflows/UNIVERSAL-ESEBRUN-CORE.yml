name: UNIVERSAL-ESEBRUN-CORE

on:
  push:
    paths:
      - 'Protocols/Universal-Esebrun-Core.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eseb-compile-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Secure Backend Validation & Compile ESEB Living Entity
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "[V-STAMP-24] Executing secure backend verification of 04 AI API Tokens for DONABICO GLOBAL MEDIA SYSTEM"
          
          # Kiểm tra bảo mật ngầm: Đảm bảo các Secret đã được thiết lập đầy đủ trên kho
          if [ -z "$API_GROQ_TOKEN" ] || [ -z "$ESEB_CLASSIC_TOKEN" ] || [ -z "$LLAMA_NVIDIA_TOKEN" ] || [ -z "$NEMOTRON_NVIDIA_TOKEN" ]; then
            echo "[ERROR] Security Alert: One or more required GitHub Secrets are missing from the repository vault!"
            exit 1
          else
            echo "[SUCCESS] All 04 AI API Secrets successfully authenticated in backend vault."
          fi

          mkdir -p Protocols
          if [ -f "Protocols/Universal-Esebrun-Core.eseb" ]; then
            # Sao chép trực tiếp tệp nguồn sạch sẽ sang tệp biên dịch .ehc (Không chứa bất kỳ thông tin token nào)
            cp Protocols/Universal-Esebrun-Core.eseb Protocols/Universal-Esebrun-Core.ehc
            echo "[SUCCESS] Compiled Protocols/Universal-Esebrun-Core.ehc with Zero-Exposure Architecture."
          else
            echo "[ERROR] Protocols/Universal-Esebrun-Core.eseb source not found."
            exit 1
          fi

      - name: Commit and Push Living Entity Bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compiled Universal-Esebrun-Core.ehc (Zero-Exposure Secure Build) [V-STAMP-24]"
          file_pattern: "Protocols/Universal-Esebrun-Core.ehc"
