name: TRAFFIC_TURBOCHARGER

on:
  push:
    paths:
      - 'Protocols/Traffic_Turbocharger.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-standalone-turbo-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Standalone ESEB Traffic Turbocharger Engine
        run: |
          python Protocols/Traffic_Turbocharger.eseb

      - name: Execute Standalone Traffic Turbocharger & Global Syndication Pings
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          node Protocols/Traffic_Turbocharger.js

      - name: Commit & Sync Standalone Living Entities
        run: |
          git config --global user.name "donabico-global-media[bot]"
          git config --global user.email "bot@donabico.com"
          git add Protocols/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(eseb): auto-compile standalone Traffic_Turbocharger artifacts [V-STAMP-24]"
            git pull origin main --rebase || git pull origin master --rebase || true
            git push origin HEAD:main || git push origin HEAD:master
          else
            echo "No changes detected. Skipping commit."
          fi
