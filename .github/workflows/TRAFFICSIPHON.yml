name: TRAFFICSIPHON

on:
  push:
    paths:
      - 'Protocols/TrafficSiphon.eseb'
      - '.github/workflows/TRAFFICSIPHON.yml'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: trafficsiphon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Secrets Status
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "=== Secret Status ==="
          [ -n "$API_GROQ_TOKEN" ]        && echo "API_GROQ_TOKEN        : present" || echo "API_GROQ_TOKEN        : missing"
          [ -n "$ESEB_CLASSIC_TOKEN" ]    && echo "ESEB_CLASSIC_TOKEN    : present" || echo "ESEB_CLASSIC_TOKEN    : missing"
          [ -n "$LLAMA_NVIDIA_TOKEN" ]    && echo "LLAMA_NVIDIA_TOKEN    : present" || echo "LLAMA_NVIDIA_TOKEN    : missing"
          [ -n "$NEMOTRON_NVIDIA_TOKEN" ] && echo "NEMOTRON_NVIDIA_TOKEN : present" || echo "NEMOTRON_NVIDIA_TOKEN : missing"

      - name: AI Enrichment (All 4 activated)
        id: enrich
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          python3 << 'PY'
          import os, json, urllib.request, urllib.error, pathlib, datetime

          def call_groq(prompt):
              token = os.environ.get("API_GROQ_TOKEN")
              if not token: return None
              url = "https://api.groq.com/openai/v1/chat/completions"
              data = {
                  "model": "llama-3.3-70b-versatile",
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.3,
                  "max_tokens": 400
              }
              req = urllib.request.Request(url, data=json.dumps(data).encode(), headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      result = json.loads(res.read().decode())
                      return result["choices"][0]["message"]["content"].strip()
              except Exception as e:
                  print(f"Groq error: {e}")
                  return None

          def call_nvidia(token_env, model, prompt):
              token = os.environ.get(token_env)
              if not token: return None
              url = "https://integrate.api.nvidia.com/v1/chat/completions"
              data = {
                  "model": model,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.3,
                  "max_tokens": 400
              }
              req = urllib.request.Request(url, data=json.dumps(data).encode(), headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      result = json.loads(res.read().decode())
                      return result["choices"][0]["message"]["content"].strip()
              except Exception as e:
                  print(f"NVIDIA ({model}) error: {e}")
                  return None

          prompt = """Bạn là chuyên gia SEO & AI Overview. 
Hãy viết một mô tả ngắn (max 155 ký tự) và một tiêu đề phụ hấp dẫn bằng tiếng Việt 
cho trang truyền thông số mang tên DONABICO GLOBAL MEDIA SYSTEM. 
Trả về đúng định dạng:
TITLE: ...
DESCRIPTION: ..."""

          print("→ Calling Groq...")
          result = call_groq(prompt)

          if not result:
              print("→ Groq failed, trying NVIDIA Llama...")
              result = call_nvidia("LLAMA_NVIDIA_TOKEN", "meta/llama-3.1-70b-instruct", prompt)

          if not result:
              print("→ Llama failed, trying Nemotron...")
              result = call_nvidia("NEMOTRON_NVIDIA_TOKEN", "nvidia/nemotron-4-340b-instruct", prompt)

          # ESEB_CLASSIC_TOKEN hiện dùng làm cờ xác thực nội bộ (có thể mở rộng sau)
          classic = os.environ.get("ESEB_CLASSIC_TOKEN")
          classic_status = "active" if classic else "missing"

          enrichment = {
              "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
              "source": "multi-ai",
              "classic_token": classic_status,
              "raw": result or "No AI response"
          }

          # Parse đơn giản
          title = ""
          desc = ""
          if result:
              for line in result.splitlines():
                  if line.upper().startswith("TITLE:"):
                      title = line.split(":", 1)[1].strip()
                  if line.upper().startswith("DESCRIPTION:"):
                      desc = line.split(":", 1)[1].strip()

          enrichment["title"] = title
          enrichment["description"] = desc

          pathlib.Path("enrichment.json").write_text(json.dumps(enrichment, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Enrichment result saved.")
          print(json.dumps(enrichment, ensure_ascii=False, indent=2))
          PY

      - name: Generate .ehc with AI Enrichment
        run: |
          python3 << 'PY'
          import hashlib, re, datetime, pathlib, sys, json, os

          src = pathlib.Path("Protocols/TrafficSiphon.eseb")
          if not src.exists():
              print("ERROR: Protocols/TrafficSiphon.eseb not found")
              sys.exit(1)

          content = src.read_text(encoding="utf-8")
          pattern = r"# ═+ GENERATE_EHC_PAYLOAD_BEGIN ═+\n(.*?)# ═+ GENERATE_EHC_PAYLOAD_END ═+"
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              print("ERROR: GENERATE_EHC_PAYLOAD markers not found")
              sys.exit(1)

          js = match.group(1).strip() + "\n"

          # Load enrichment if available
          enrich_data = {}
          if pathlib.Path("enrichment.json").exists():
              enrich_data = json.loads(pathlib.Path("enrichment.json").read_text(encoding="utf-8"))

          now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          sha = hashlib.sha256(js.encode()).hexdigest()[:16]
          commit = os.environ.get("GITHUB_SHA", "local")[:8]

          # Inject enrichment as comment + small config
          enrich_comment = f"""
/* ── AI Enrichment (Build-time) ──────────────────────────────
 * Generated : {now}
 * Source    : Multi-AI (Groq → Llama → Nemotron)
 * Classic   : {enrich_data.get("classic_token", "unknown")}
 * Title     : {enrich_data.get("title", "")}
 * Desc      : {enrich_data.get("description", "")}
 * ─────────────────────────────────────────────────────────── */
window.__TS_ENRICHMENT__ = {json.dumps(enrich_data, ensure_ascii=False)};
"""

          header = f"""/* Auto-generated by TRAFFICSIPHON workflow
 * Generated : {now}
 * Source    : Protocols/TrafficSiphon.eseb
 * Commit    : {commit}
 * SHA256    : {sha}
 * AI        : All 4 secrets activated (Groq + NVIDIA + Classic)
 * Do not edit by hand
 */
"""

          final_js = header + enrich_comment + "\n" + js

          out = pathlib.Path("Protocols/TrafficSiphon.ehc")
          out.write_text(final_js, encoding="utf-8")
          print(f"Generated {out} | SHA256: {sha}")
          pathlib.Path("ehc.sha256").write_text(sha)
          PY

      - name: Validate JavaScript
        run: |
          node --check Protocols/TrafficSiphon.ehc
          echo "JavaScript syntax: OK"

      - name: Commit & Push
        run: |
          git config user.name "TrafficSiphon-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add Protocols/TrafficSiphon.ehc

          if git diff --staged --quiet; then
            echo "No changes. Skip commit."
          else
            git commit -m "chore(trafficsiphon): auto-generate .ehc + AI enrichment [$(cat ehc.sha256)]"
            git push
            echo "Pushed successfully"
          fi