name: TRAFFICSIPHON

on:
  push:
    paths:
      - 'Protocols/TrafficSiphon.eseb'
      - '.github/workflows/TRAFFICSIPHON.yml'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check secrets
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "API_GROQ_TOKEN: $([ -n \"$API_GROQ_TOKEN\" ] && echo present || echo missing)"
          echo "ESEB_CLASSIC_TOKEN: $([ -n \"$ESEB_CLASSIC_TOKEN\" ] && echo present || echo missing)"
          echo "LLAMA_NVIDIA_TOKEN: $([ -n \"$LLAMA_NVIDIA_TOKEN\" ] && echo present || echo missing)"
          echo "NEMOTRON_NVIDIA_TOKEN: $([ -n \"$NEMOTRON_NVIDIA_TOKEN\" ] && echo present || echo missing)"

      - name: Generate ehc from eseb
        run: |
          if [ ! -f Protocols/TrafficSiphon.eseb ]; then
            echo "ERROR: Protocols/TrafficSiphon.eseb not found"
            exit 1
          fi

          awk '
            /GENERATE_EHC_PAYLOAD_BEGIN/ {flag=1; next}
            /GENERATE_EHC_PAYLOAD_END/   {flag=0}
            flag && !/^# ═/ {print}
          ' Protocols/TrafficSiphon.eseb > /tmp/payload.js

          grep -v '^#' /tmp/payload.js > /tmp/payload_clean.js || true
          mv /tmp/payload_clean.js /tmp/payload.js

          if [ ! -s /tmp/payload.js ]; then
            echo "ERROR: Could not extract clean JavaScript payload"
            exit 1
          fi

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=$(sha256sum /tmp/payload.js | cut -c1-16)

          {
            echo "/* Auto-generated by TRAFFICSIPHON workflow"
            echo " * Time   : $NOW"
            echo " * SHA256 : $SHA"
            echo " * Do not edit by hand"
            echo " */"
            echo ""
            echo "window.__TS_ENRICHMENT__ = window.__TS_ENRICHMENT__ || {};"
            echo ""
            cat /tmp/payload.js
          } > Protocols/TrafficSiphon.ehc

          echo "Generated Protocols/TrafficSiphon.ehc"
          wc -l Protocols/TrafficSiphon.ehc
          echo "$SHA" > ehc.sha256

      - name: Validate JavaScript
        run: |
          cp Protocols/TrafficSiphon.ehc /tmp/TrafficSiphon.js
          node --check /tmp/TrafficSiphon.js
          echo "JavaScript syntax OK"

      - name: Commit and push
        run: |
          git config user.name "TrafficSiphon-Bot"
          git config user.email "bot@users.noreply.github.com"

          git add Protocols/TrafficSiphon.ehc

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(trafficsiphon): auto-generate .ehc [$(cat ehc.sha256)]"
            git pull --rebase origin main
            git push origin main
            echo "Pushed successfully"
          fi