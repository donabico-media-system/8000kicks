name: TrafficSiphon

on:
  push:
    paths:
      - 'Protocols/TrafficSiphon.eseb'
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets (names only, values never printed)
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "Checking secrets..."
          [ -n "$API_GROQ_TOKEN" ]        && echo "API_GROQ_TOKEN: present"        || echo "API_GROQ_TOKEN: missing"
          [ -n "$ESEB_CLASSIC_TOKEN" ]    && echo "ESEB_CLASSIC_TOKEN: present"    || echo "ESEB_CLASSIC_TOKEN: missing"
          [ -n "$LLAMA_NVIDIA_TOKEN" ]    && echo "LLAMA_NVIDIA_TOKEN: present"    || echo "LLAMA_NVIDIA_TOKEN: missing"
          [ -n "$NEMOTRON_NVIDIA_TOKEN" ] && echo "NEMOTRON_NVIDIA_TOKEN: present" || echo "NEMOTRON_NVIDIA_TOKEN: missing"

      - name: Optional AI enrichment (build-time only)
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          echo "AI enrichment step (tokens stay inside this job only)"
          # Example (commented out):
          # curl -s https://api.groq.com/openai/v1/chat/completions \
          #   -H "Authorization: Bearer $API_GROQ_TOKEN" \
          #   -H "Content-Type: application/json" \
          #   -d '{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":"..."}]}'
          echo "Skipped real API calls (placeholder)"

      - name: Generate .ehc from .eseb
        run: |
          echo "Generating Protocols/TrafficSiphon.ehc..."
          awk '
            /GENERATE_EHC_PAYLOAD_BEGIN/ {flag=1; next}
            /GENERATE_EHC_PAYLOAD_END/   {flag=0}
            flag && /^\/\*\*/ {js=1}
            flag && js && !/^# ═/ {print}
          ' Protocols/TrafficSiphon.eseb > Protocols/TrafficSiphon.ehc

          {
            echo "/* Auto-generated by TrafficSiphon workflow | $(date -u +%Y-%m-%dT%H:%M:%SZ) */"
            echo "/* Source: Protocols/TrafficSiphon.eseb | Do not edit by hand */"
            cat Protocols/TrafficSiphon.ehc
          } > Protocols/TrafficSiphon.ehc.tmp
          mv Protocols/TrafficSiphon.ehc.tmp Protocols/TrafficSiphon.ehc

          echo "Done."
          wc -l Protocols/TrafficSiphon.ehc

      - name: Commit generated file
        run: |
          git config user.name "TrafficSiphon-Bot"
          git config user.email "bot@local"
          git add Protocols/TrafficSiphon.ehc
          git diff --staged --quiet || git commit -m "Auto-generate TrafficSiphon.ehc"
          git push || true