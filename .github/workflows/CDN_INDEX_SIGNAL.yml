name: CDN_INDEX_SIGNAL

on:
  push:
    paths:
      - 'Protocols/Cdn_Index_Signal.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  eseb-dynamic-compilation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Matrix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute ESEB Dual-Token Compilation & Execution
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          echo "=== STARTING ESEB DUAL-TOKEN COMPILATION ==="
          python Protocols/Cdn_Index_Signal.eseb
          echo "=== EXECUTING SERVERLESS AI REST API ==="
          node Protocols/Cdn_Index_Signal.js
          echo "=== DUAL-TOKEN EXECUTION COMPLETE: ENTROPY = 0 ==="

      - name: Commit and Push Living Entity Artifacts
        run: |
          git config --global user.name "Donabico-Action-Bot"
          git config --global user.email "bot@donabico.global"
          git add Protocols/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-sync Cdn_Index_Signal Dual-Token Entities [V-STAMP-24]"
            git pull origin main --rebase || git pull origin master --rebase || true
            git push origin HEAD:main || git push origin HEAD:master
          else
            echo "No changes detected. Skipping commit."
          fi
