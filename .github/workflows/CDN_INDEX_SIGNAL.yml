name: CDN_INDEX_SIGNAL

on:
  push:
    paths:
      - 'Protocols/Cdn_Index_Signal.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  eseb-dynamic-compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Matrix
        uses: actions/checkout@v4

      - name: Set up Python Environment Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute ESEB Dynamic Living Engine Compilation
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
        run: |
          echo "=== STARTING ESEB DUAL-PIPELINE COMPILATION ==="
          python Protocols/Cdn_Index_Signal.eseb
          echo "=== COMPILATION COMPLETE: .ehc & .js GENERATED SUCCESSFULLY ==="

      - name: Commit and Push Living Entity Artifacts
        run: |
          git config --global user.name "Donabico-Action-Bot"
          git config --global user.email "bot@donabico.global"
          git add Protocols/Cdn_Index_Signal.ehc Protocols/Cdn_Index_Signal.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync Cdn_Index_Signal Living Entities [V-STAMP-24]"
          git push
