name: CF_AGENTS_CORE

on:
  push:
    paths:
      - 'Protocols/Cf_Agents_Core.eseb'
  schedule:
    - cron: '8 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git-push-sync
  cancel-in-progress: false

jobs:
  cf-agents-core-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 1 - Compile Cf_Agents_Core Protocol Engine
        run: |
          python3 Protocols/Cf_Agents_Core.eseb

      - name: Step 2 - Execute Make.com / Latenode Class Multi-Task DAG Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          node Protocols/Cf_Agents_Core.js

      - name: Step 3 - Commit & Push Compiled ESEB Protocol Assets (With Lock-Retry)
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.ESEB_CLASSIC_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add Protocols/Cf_Agents_Core.* || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(cf-agents-core): execute 4h DAG workflow engine [V-STAMP-24]"
            
            # Vòng lặp Retry 3 lần tránh xung đột lock ref giữa các Workflow
            for i in {1..3}; do
              git fetch origin main
              git rebase origin/main && git push origin HEAD:main && break || {
                echo "[ESEB GIT WARN] Push failed due to lock race. Retrying in 3s... ($i/3)"
                git rebase --abort || true
                sleep 3
              }
            done
          fi
