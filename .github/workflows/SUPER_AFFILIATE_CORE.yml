name: SUPER_AFFILIATE_CORE

on:
  push:
    paths:
      - 'Protocols/Super_Affiliate_Core.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-eseb-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and Generate ESEB Living Entities via Python Core
        run: |
          echo "[INFO] Compiling Super_Affiliate_Core.eseb to generate .ehc and .js files..."
          python Protocols/Super_Affiliate_Core.eseb

      - name: Execute Serverless AI Runner & Traffic Turbocharger with Real Tokens
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          echo "[INFO] Running ESEB Serverless AI REST API Engine with Real Token Authentication..."
          node Protocols/Super_Affiliate_Core.js

      - name: Commit & Sync Living Entities
        run: |
          git config --global user.name "donabico-global-media[bot]"
          git config --global user.email "bot@donabico.com"
          git add Protocols/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(eseb): auto-compile and sync Super_Affiliate_Core artifacts [V-STAMP-24]"
            git pull origin main --rebase || git pull origin master --rebase || true
            git push origin HEAD:main || git push origin HEAD:master
          else
            echo "No changes detected. Skipping commit."
          fi
