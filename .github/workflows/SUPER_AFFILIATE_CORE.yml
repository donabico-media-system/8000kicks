name: SUPER_AFFILIATE_CORE

on:
  schedule:
    - cron: '0 */4 * * *' # Xoay vòng Round-Robin 8 AI Node & Stealth Indexing 4 tiếng/lần
  workflow_dispatch:

jobs:
  SUPER_AFFILIATE_CORE:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Execute ESEB 04THU Auto-6D Protocol Generator & Runner
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "[ESEB 04THU PROTOCOL] Initializing Auto-6D Ultimate Engine (.ehc & .js generator)..."
          python3 Protocols/Super_Affiliate_Core.eseb
          
          echo "[SERVERLESS RUNNER] Executing Super Smart Intelligent Rotational Cloudflare AI Node & Stealth Indexer..."
          node Protocols/Super_Affiliate_Core.js

      - name: Commit and Push Living Entity Artifacts
        run: |
          git config --global user.name "donabico-media-system"
          git config --global user.email "bot@donabico.media"
          git add Protocols/ sitemap.xml
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(eseb-auto-6d): auto-compile verified HTTP 200 artifacts & sitemap [V-STAMP-24]"
            git pull origin main --rebase || git pull origin master --rebase || true
            git push origin HEAD:main --force || git push origin HEAD:master --force
          else
            echo "No changes detected. Skipping commit."
          fi
