name: ETERNALCORE

on:
  push:
    paths:
      - "Protocols/EternalCore.eseb"
      - ".github/workflows/ETERNALCORE.yml"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: AI Enrichment (4 Secrets)
        id: ai
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          set -e
          echo "Checking secrets..."
          [ -n "$API_GROQ_TOKEN" ] && echo "API_GROQ_TOKEN: present" || echo "API_GROQ_TOKEN: missing"
          [ -n "$ESEB_CLASSIC_TOKEN" ] && echo "ESEB_CLASSIC_TOKEN: present" || echo "ESEB_CLASSIC_TOKEN: missing"
          [ -n "$LLAMA_NVIDIA_TOKEN" ] && echo "LLAMA_NVIDIA_TOKEN: present" || echo "LLAMA_NVIDIA_TOKEN: missing"
          [ -n "$NEMOTRON_NVIDIA_TOKEN" ] && echo "NEMOTRON_NVIDIA_TOKEN: present" || echo "NEMOTRON_NVIDIA_TOKEN: missing"

          PROMPT='You are SEO + continual learning strategist for DONABICO GLOBAL MEDIA SYSTEM. Reply ONLY valid JSON: {"title":"string under 60 chars","description":"string under 155 chars in Vietnamese","strategies":["str1","str2","str3"]}. No markdown, no explanation.'

          ENRICH='{"title":"DONABICO GLOBAL MEDIA SYSTEM","description":"Hệ thống truyền thông số thông minh – DONABICO GLOBAL MEDIA SYSTEM","strategies":[],"aiSource":"fallback"}'

          call_ai() {
            local url="$1"
            local token="$2"
            local model="$3"
            local source="$4"

            if [ -z "$token" ]; then
              echo "$source: token empty → skip"
              return
            fi

            echo "Calling $source ($model) ..."

            BODY=$(jq -n \
              --arg model "$model" \
              --arg prompt "$PROMPT" \
              '{model: $model, messages: [{role: "user", content: $prompt}], temperature: 0.25, max_tokens: 400}')

            RESP=$(curl -s --max-time 30 -X POST "$url" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -d "$BODY" || true)

            echo "----- Raw response from $source (first 500 chars) -----"
            echo "$RESP" | head -c 500
            echo ""
            echo "-------------------------------------------------------"

            CONTENT=$(echo "$RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)

            if [ -z "$CONTENT" ]; then
              echo "$source: no content"
              return
            fi

            CLEAN=$(echo "$CONTENT" | sed -n 's/.*\({.*}\).*/\1/p' | tail -n 1)

            if [ -n "$CLEAN" ] && echo "$CLEAN" | jq -e . >/dev/null 2>&1; then
              ENRICH=$(echo "$CLEAN" | jq -c --arg s "$source" '. + {aiSource: $s}')
              echo "$source → SUCCESS"
              echo "Parsed: $ENRICH"
            else
              echo "$source: could not extract valid JSON"
            fi
          }

          call_ai "https://api.groq.com/openai/v1/chat/completions" "$API_GROQ_TOKEN" "llama-3.3-70b-versatile" "groq"

          if [ "$(echo "$ENRICH" | jq -r '.aiSource')" = "fallback" ]; then
            call_ai "https://integrate.api.nvidia.com/v1/chat/completions" "$LLAMA_NVIDIA_TOKEN" "meta/llama-3.1-70b-instruct" "llama-nvidia"
          fi

          if [ "$(echo "$ENRICH" | jq -r '.aiSource')" = "fallback" ]; then
            call_ai "https://integrate.api.nvidia.com/v1/chat/completions" "$NEMOTRON_NVIDIA_TOKEN" "nvidia/llama-3.1-nemotron-70b-instruct" "nemotron"
          fi

          if [ "$(echo "$ENRICH" | jq -r '.aiSource')" = "fallback" ] && [ -n "$ESEB_CLASSIC_TOKEN" ]; then
            ENRICH=$(echo "$ENRICH" | jq -c '. + {aiSource: "eseb-classic"}')
            echo "All AI failed → using eseb-classic fallback"
          fi

          echo "$ENRICH" > /tmp/enrich.json
          echo "===== FINAL ENRICHMENT ====="
          cat /tmp/enrich.json
          echo "============================"

      - name: Generate ehc
        run: |
          set -e
          if [ ! -f Protocols/EternalCore.eseb ]; then
            echo "ERROR: Protocols/EternalCore.eseb not found"
            exit 1
          fi

          awk '
            /GENERATE_EHC_PAYLOAD_BEGIN/ {flag=1; next}
            /GENERATE_EHC_PAYLOAD_END/   {flag=0}
            flag && !/^# ═/ {print}
          ' Protocols/EternalCore.eseb > /tmp/payload.js

          if [ ! -s /tmp/payload.js ]; then
            echo "ERROR: empty payload"
            exit 1
          fi

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=$(sha256sum /tmp/payload.js | cut -c1-16)
          ENRICH=$(cat /tmp/enrich.json)

          FEEDBACK='{}'
          if [ -f feedback.json ]; then
            FEEDBACK=$(cat feedback.json)
            echo "Feedback loaded"
          fi

          {
            echo "/* Auto-generated by ETERNALCORE workflow"
            echo " * Time   : $NOW"
            echo " * SHA256 : $SHA"
            echo " * AI     : server-side only"
            echo " * Do not edit by hand"
            echo " */"
            echo ""
            echo "window.__EC_ENRICHMENT__ = $ENRICH;"
            echo "window.__EC_FEEDBACK__ = $FEEDBACK;"
            echo ""
            cat /tmp/payload.js
          } > Protocols/EternalCore.ehc

          echo "$SHA" > ehc.sha256
          echo "Generated Protocols/EternalCore.ehc"
          wc -l Protocols/EternalCore.ehc

      - name: Validate JS
        run: |
          cp Protocols/EternalCore.ehc /tmp/EternalCore.js
          node --check /tmp/EternalCore.js
          echo "JavaScript OK"

      - name: Commit and push
        run: |
          git config user.name "EternalCore-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add Protocols/EternalCore.ehc

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(eternalcore): auto-generate .ehc [$(cat ehc.sha256)]"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed OK"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || true
            if grep -q '<<<<<<<' Protocols/EternalCore.ehc 2>/dev/null; then
              git checkout --ours Protocols/EternalCore.ehc
              git add Protocols/EternalCore.ehc
              GIT_EDITOR=true git rebase --continue || true
            fi
            sleep 2
          done
          echo "Push failed after retries"
          exit 1