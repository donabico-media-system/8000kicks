name: ESEB-DYNAMIC-HYPER
on:
  schedule:
    - cron: '*/10 * * * *'  # Chạy tự động mỗi 10 phút
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hyper-rotation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Sequential Dynamic Rotation with Quad Secrets
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
        run: |
          python ESEB-Rotator.py

      - name: Commit and Push Bridge Artifacts
        run: |
          git config --global user.name "ESEB-HYPER-BOT"
          git config --global user.email "bot@eseb.internal"
          git add Bridges/*.ehc ESEB-Dynamic-Hyper.json
          git commit -m "Auto-Rotate ESEB Hyper Cycle [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || exit 0
          git push
