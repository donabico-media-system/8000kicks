name: ESEB-DYNAMIC-HYPER

on:
  schedule:
    - cron: '*/10 * * * *'  # Chu kỳ tự động kích hoạt mỗi 10 phút
  workflow_dispatch:        # Kích hoạt thủ công qua giao diện GitHub Actions

permissions:
  contents: write

jobs:
  hyper-rotation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Sequential Dynamic Rotation
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
        run: |
          python ESEB-Rotator.py

      - name: Commit and Push Bridge Artifacts
        run: |
          git config --global user.name "EATHESEN-BOT-V3000"
          git config --global user.email "bot@donabico.global"
          git add Bridges/*.ehc ESEB-Dynamic-Hyper.json
          git commit -m "Auto-Rotate ESEB Hyper Cycle [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || exit 0
          git push "https://x-access-token:${{ secrets.ESEB_CLASSIC_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
