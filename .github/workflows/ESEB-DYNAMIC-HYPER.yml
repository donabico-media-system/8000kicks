name: ESEB-DYNAMIC-HYPER

on:
  push:
    paths:
      - 'Protocols/**.eseb'
  workflow_dispatch:

jobs:
  generate-living-entity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Living Entity
        run: |
          mkdir -p Bridges
          cp Protocols/Eseb-Living-Magnet.eseb Bridges/Schema-Accelerator.ehc

      - name: Commit Living Entity
        run: |
          git config user.name "ESEB-BOT-V3000"
          git config user.email "eseb@donabico.com"
          git add Bridges/Schema-Accelerator.ehc
          git diff --staged --quiet || git commit -m "ESEB SOTA Living Entity [¢24] [V-STAMP-24]"
          git push