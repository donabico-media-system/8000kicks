name: ESEB-DYNAMIC-HYPER

on:
  schedule:
    - cron: '*/10 * * * *'  # Chạy tự động mỗi 10 phút[span_1](start_span)[span_1](end_span)
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Tên tệp .eseb cần kiểm tra (Ví dụ: ESEB-Autonomous-Evolution.eseb)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  hyper-rotation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Kéo toàn bộ lịch sử để phục vụ rebase[span_2](start_span)[span_2](end_span)

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Sequential Dynamic Rotation with Quad Secrets & Recursive Ingestion
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
          LLAMA_NVIDIA_TOKEN: ${{ secrets.LLAMA_NVIDIA_TOKEN }}
          NEMOTRON_NVIDIA_TOKEN: ${{ secrets.NEMOTRON_NVIDIA_TOKEN }}
          INPUT_TARGET_FILE: ${{ github.event.inputs.target_file }}
        run: |
          python ESEB-Rotator.py

      - name: Commit and Push Bridge Artifacts & Evolution States
        run: |
          git config --global user.name "ESEB-HYPER-BOT"
          git config --global user.email "bot@eseb.internal"
          git add Bridges/*.ehc ESEB-Dynamic-Hyper.json Protocols/External-Links-Matrix.json Protocols/ESEB-Autonomous-Evolution.json
          git commit -m "Auto-Rotate ESEB Hyper Cycle & Recursive Ingestion [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || exit 0
          git pull origin main --rebase -X theirs
          git push origin main
