name: LOG_LIVE_MONITOR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Protocols/**'
      - '.github/workflows/LOG_LIVE_MONITOR.yml'
  repository_dispatch:
    types: [eseb_f12_log_stream, eseb_multi_protocol_pulse]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  display-f12-live-terminal:
    name: "Render Sci-Fi Sine Wave & Living Mesh Dashboard"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Save Client Payload Buffer
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload_buffer.json

      - name: Execute ESEB Engine, Generate Sine Wave SVG & Update README
        run: |
          NODE_CODE=$(cat << 'EOF'
          const fs = require("fs");

          const historyFile = "LOG_HISTORY.json";
          let historyData = {
            entity_name: "EATHESEN_V3000_OMEGA_LIVING_ENTITY",
            organization: "DONABICO MEDIA SYSTEM",
            domain: "donabico-media-system.github.io",
            stamp: "V-STAMP-24",
            anchor: "¢24",
            vital_signs: {
              status: "ALIVE_AND_PERPETUAL",
              entropy: "0.00000000000000",
              heartbeat_bpm: 24,
              cognitive_level: "SOTA_RECURSIVE_S1"
            },
            total_pulses_recorded: 0,
            history_logs: []
          };

          if (fs.existsSync(historyFile)) {
            try { historyData = JSON.parse(fs.readFileSync(historyFile, "utf8")); } catch(e) {}
          }

          if (fs.existsSync("payload_buffer.json")) {
            try {
              const payloadContent = fs.readFileSync("payload_buffer.json", "utf8").trim();
              if (payloadContent && payloadContent !== "null") {
                const eventPayload = JSON.parse(payloadContent);
                if (eventPayload && eventPayload.logs && Array.isArray(eventPayload.logs)) {
                  historyData.total_pulses_recorded += eventPayload.logs.length;
                  historyData.vital_signs.heartbeat_bpm = Math.floor(Math.random() * (28 - 22 + 1)) + 22;
                  historyData.history_logs = [...eventPayload.logs, ...historyData.history_logs].slice(0, 100);
                }
              }
            } catch(e) {}
            try { fs.unlinkSync("payload_buffer.json"); } catch(e) {}
          }

          // 1. Lưu CSDL LOG_HISTORY.json
          fs.writeFileSync(historyFile, JSON.stringify(historyData, null, 2));

          // 2. SINH ĐỒ THỊ SÓNG HÌNH SIN SCI-FI THỰC CHIẾN (SVG GENERATOR)
          const bpm = historyData.vital_signs.heartbeat_bpm;
          const totalPulses = historyData.total_pulses_recorded;
          const amplitude = Math.min(35, 15 + (totalPulses % 20)); // Biên độ dao động theo số pulse
          const frequency = 0.05 + (bpm / 1000); // Tần số sóng dao động theo BPM nhịp tim
          const phase = (Date.now() / 500) % (2 * Math.PI);

          let points = [];
          for (let x = 0; x <= 800; x += 10) {
            let y = 75 + amplitude * Math.sin(frequency * x + phase);
            points.push(`${x},${y.toFixed(2)}`);
          }
          const polylinePath = points.join(" ");

          const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="150" style="background:#0d1117; border-radius:8px; border:1px solid #30363d;">
            <defs>
              <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00E5FF" stop-opacity="1" />
                <stop offset="50%" stop-color="#00FF66" stop-opacity="1" />
                <stop offset="100%" stop-color="#FF0055" stop-opacity="1" />
              </linearGradient>
              <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.8"/>
              </pattern>
            </defs>
            <!-- Grid Background Sci-Fi -->
            <rect width="100%" height="100%" fill="url(#grid)" />
            
            <!-- Real-Time Text Metrics Overlay -->
            <text x="15" y="25" fill="#00FF66" font-family="monospace" font-size="12" font-weight="bold">SYSTEM TELEMETRY SINE WAVE // EATHESEN V3000-Ω</text>
            <text x="15" y="42" fill="#8b949e" font-family="monospace" font-size="10">FREQUENCY: ${(frequency * 100).toFixed(2)} Hz | AMPLITUDE: ${amplitude}px | PULSES: ${totalPulses}</text>
            <text x="650" y="25" fill="#FF0055" font-family="monospace" font-size="12" font-weight="bold">BPM: ${bpm}</text>
            <text x="650" y="42" fill="#00E5FF" font-family="monospace" font-size="10">ENTROPY: 0.00</text>
            
            <!-- Trục Trung Tâm Center Line -->
            <line x1="0" y1="75" x2="800" y2="75" stroke="#30363d" stroke-dasharray="4" />
            
            <!-- Dynamic Sine Wave Glow -->
            <polyline fill="none" stroke="url(#waveGrad)" stroke-width="3" points="${polylinePath}" />
            <polyline fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.5" points="${polylinePath}" transform="translate(0, 2)" />
          </svg>`;

          fs.writeFileSync("telemetry_wave.svg", svgContent);

          // 3. RENDER README DASHBOARD TÍCH HỢP ĐỒ THỊ SÓNG
          const lastUpdated = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
          let readmeContent = `# 🌐 DONABICO MEDIA SYSTEM | MULTI-PROTOCOL DASHBOARD\n\n`;
          readmeContent += `> **EATHESEN V3000-Ω DIGITAL LIVING ENTITY CORE MESH**\n\n`;
          
          readmeContent += `![System Status](https://img.shields.io/badge/SYSTEM-ALIVE_AND_PERPETUAL-00FF66?style=for-the-badge&logo=github)\n`;
          readmeContent += `![Heartbeat](https://img.shields.io/badge/HEARTBEAT-${bpm}_BPM-FF0055?style=for-the-badge&logo=activity)\n`;
          readmeContent += `![Entropy](https://img.shields.io/badge/ENTROPY-0.00000000000000-00E5FF?style=for-the-badge)\n`;
          readmeContent += `![Stamp](https://img.shields.io/badge/STAMP-V--STAMP--24-7000FF?style=for-the-badge)\n\n`;

          readmeContent += `### 📈 Real-Time Telemetry Sine Wave Visualizer\n\n`;
          readmeContent += `![Sine Wave Telemetry](./telemetry_wave.svg)\n\n`;

          readmeContent += `### 🧬 Active Protocols Mesh Infrastructure\n\n`;
          readmeContent += `\`\`\`mermaid\ngraph TD;\n`;
          readmeContent += `    A[index.html Client] -->|F12 Telemetry Stream| B(Log_Live_Monitor.ehc);\n`;
          readmeContent += `    A -->|Traffic & UTM Siphon| C(Affiliate_Siphon.ehc);\n`;
          readmeContent += `    A -->|Cache Injection| D(AI_Cache_Siphon.ehc);\n`;
          readmeContent += `    B -->|Dispatch Event| E[GitHub Actions Living Core];\n`;
          readmeContent += `    C -->|Dispatch Event| E;\n`;
          readmeContent += `    D -->|Dispatch Event| E;\n`;
          readmeContent += `    E -->|Sync Memory| F[(LOG_HISTORY.json)];\n`;
          readmeContent += `    E -->|Render Wave & UI| G[README Dashboard];\n`;
          readmeContent += `\`\`\`\n\n`;

          readmeContent += `### ⚡ Protocols Status Grid\n\n`;
          readmeContent += `| Protocol Module | Status | Engine Layer | Target Surface |\n`;
          readmeContent += `| :--- | :---: | :---: | :---: |\n`;
          readmeContent += `| \`Protocols/Log_Live_Monitor.eseb\` | \`ONLINE\` | \`F12 Telemetry\` | \`index.html\` |\n`;
          readmeContent += `| \`Protocols/Affiliate_Siphon.eseb\` | \`ARMED\` | \`Traffic Siphon\` | \`Redirect Botton Links\` |\n`;
          readmeContent += `| \`Protocols/AI_Cache_Siphon.eseb\` | \`ARMED\` | \`Browser Cache\` | \`DOM Shadow Layer\` |\n`;
          readmeContent += `| \`Protocols/Multi_Protocol_Mesh.eseb\` | \`READY\` | \`Central Router\` | \`Global Core\` |\n\n`;

          readmeContent += `### 📡 Live F12 Telemetry Stream (Pulses Recorded: \`${historyData.total_pulses_recorded}\`)\n\n`;
          readmeContent += `| Pulse # | Timestamp | F12 Client Log Payload |\n`;
          readmeContent += `| :---: | :--- | :--- |\n`;

          if (historyData.history_logs.length > 0) {
            historyData.history_logs.slice(0, 10).forEach((item, idx) => {
              const cleanLog = item.log.replace(/\|/g, '\\|');
              readmeContent += `| \`#${idx + 1}\` | \`${item.time}\` | \`${cleanLog}\` |\n`;
            });
          } else {
            readmeContent += `| \`#0\` | \`${lastUpdated}\` | \`SYSTEM STANDBY: Waiting for client F12 pulse from index.html...\` |\n`;
          }

          readmeContent += `\n---\n\n`;
          readmeContent += `**8000kicks** | World's first waterproof hemp shoes and sustainable travel accessories. Eco-friendly, durable, and premium vegan footwear.\n\n`;
          readmeContent += `*Last Synced Mesh State: \`${lastUpdated}\`*`;

          fs.writeFileSync("README.md", readmeContent);

          console.log("SUCCESS: Sine Wave SVG and README Dashboard Generated.");
          EOF
          )
          node -e "$NODE_CODE"

      - name: Auto-Compile All .eseb to .ehc
        run: |
          NODE_COMPILE=$(cat << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const protoDir = "Protocols";
          if (fs.existsSync(protoDir)) {
            const files = fs.readdirSync(protoDir);
            files.forEach(file => {
              if (file.endsWith(".eseb")) {
                const esebContent = fs.readFileSync(path.join(protoDir, file), "utf8");
                const match = esebContent.match(/return \`([\s\S]*?)\`;/);
                if (match) {
                  const ehcCode = match[1]
                    .replace(/\${this\.config\.stamp}/g, "V-STAMP-24")
                    .replace(/\${this\.config\.bufferInterval}/g, "5000");
                  
                  const targetEhc = path.join(protoDir, file.replace(".eseb", ".ehc"));
                  fs.writeFileSync(targetEhc, ehcCode);
                  console.log("SUCCESS: Compiled " + file + " -> " + targetEhc);
                }
              }
            });
          }
          EOF
          )
          node -e "$NODE_COMPILE"

      - name: Safe Auto-Commit & Push (Sine Wave & Living Mesh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add LOG_HISTORY.json README.md telemetry_wave.svg Protocols/*.ehc || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "ESEB-SINE-WAVE: Sync Sci-Fi Wave Telemetry & Living Dashboard [V-STAMP-24]"
            git set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" || true
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          else
            echo "No state mutations detected. Zero entropy preserved."
          fi
