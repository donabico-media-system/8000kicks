name: LOG_LIVE_MONITOR

on:
  push:
    paths:
      - 'Protocols/**'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-log-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # BƯỚC NÂNG CẤP: TỰ ĐỘNG BIÊN DỊCH TOÀN BỘ CÁC FILE .eseb TRONG THƯ MỤC PROTOCOLS
      - name: Compile ALL ESEB Multi-Protocol Kernels
        run: |
          for f in Protocols/*.eseb; do
            if [ -f "$f" ]; then
              echo "Compiling ESEB Kernel: $f"
              python3 "$f"
            fi
          done

      - name: Execute Groq LPU Real AI REST Renderer
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          node Protocols/Log_Live_Monitor_Renderer.js

      - name: Force Commit & Push HUD Artifacts
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "No changes detected in repository. Entropy delta = 0."
          else
            git commit -m "chore(eseb-hud): auto-sync full trinity protocol matrix [skip ci]"
            git fetch origin main
            git rebase origin/main || git rebase --skip || true
            git push origin HEAD:main
          fi
