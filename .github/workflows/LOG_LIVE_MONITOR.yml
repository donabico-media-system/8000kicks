name: LOG_LIVE_MONITOR

on:
  push:
    paths:
      - 'Protocols/Log_Live_Monitor.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-log-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile ESEB Multi-Protocol Protocol
        run: |
          python3 Protocols/Log_Live_Monitor.eseb

      - name: Execute Real AI REST API Renderer
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          OPEN_AI_TOKEN: ${{ secrets.OPEN_AI_TOKEN }}
        run: |
          node Protocols/Log_Live_Monitor_Renderer.js

      - name: Commit & Sync Multi-Protocol Artifacts
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/donabico-media-system/8000kicks.git
          
          # 1. Fetch và Rebase trước để đồng bộ kho
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase conflict detected. Resolving automatically by favoring latest generated artifacts..."
            git checkout --ours README.md Protocols/ || true
            git add README.md Protocols/ || true
            git rebase --continue || git rebase --abort || true
          }
          
          # 2. Đưa các thay đổi vào khu vực chờ
          git add Protocols/ README.md
          
          # 3. Commit và Push an toàn tuyệt đối
          if ! git diff --staged --quiet; then
            git commit -m "chore(eseb): auto-sync multi-protocol real ai api renderer and telemetry artifacts [skip ci]"
            git push origin main
          else
            echo "No changes to commit. Entropy delta = 0."
          fi
