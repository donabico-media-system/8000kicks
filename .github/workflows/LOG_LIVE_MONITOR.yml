name: LOG_LIVE_MONITOR

on:
  push:
    paths:
      - 'Protocols/**'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-log-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile ESEB Multi-Protocol Kernels
        run: |
          python3 Protocols/Log_Live_Monitor.eseb

      - name: Execute Groq LPU Real AI REST Renderer (Update README.md)
        env:
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          node Protocols/Log_Live_Monitor.js

      - name: Force Commit & Push HUD Artifacts to README.md
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.ESEB_CLASSIC_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add README.md Protocols/Log_Live_Monitor.* || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(eseb-hud): auto-sync real-time cockpit README.md [skip ci]"
            
            for i in {1..3}; do
              git fetch origin main
              git rebase origin/main && git push origin HEAD:main && break || {
                echo "[ESEB GIT WARN] Push lock race. Retrying in 3s... ($i/3)"
                git rebase --abort || true
                sleep 3
              }
            done
          else
            echo "No changes detected in README.md. Entropy delta = 0."
          fi
