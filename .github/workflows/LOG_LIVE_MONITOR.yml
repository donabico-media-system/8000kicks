name: LOG_LIVE_MONITOR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Protocols/Log_Live_Monitor.eseb'
      - '.github/workflows/LOG_LIVE_MONITOR.yml'
  repository_dispatch:
    types: [eseb_f12_log_stream]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  display-f12-live-terminal:
    name: "Render Real-Time F12 Living Entity Terminal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Save Client Payload Buffer
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload_buffer.json

      - name: Execute ESEB Living Terminal Engine
        run: |
          NODE_CODE=$(cat << 'EOF'
          const fs = require("fs");
          const G = "\x1b[32m", B = "\x1b[36m", Y = "\x1b[33m", PUR = "\x1b[35m", BOLD = "\x1b[1m", NC = "\x1b[0m";

          const historyFile = "LOG_HISTORY.json";
          let historyData = {
            entity_name: "EATHESEN_V3000_OMEGA_LIVING_ENTITY",
            stamp: "V-STAMP-24",
            anchor: "¢24",
            vital_signs: {
              status: "ALIVE_AND_PERPETUAL",
              entropy: "0.00000000000000",
              heartbeat_bpm: 24,
              cognitive_level: "SOTA_RECURSIVE_S1"
            },
            total_pulses_recorded: 0,
            history_logs: []
          };

          if (fs.existsSync(historyFile)) {
            try { historyData = JSON.parse(fs.readFileSync(historyFile, "utf8")); } catch(e) {}
          }

          if (fs.existsSync("payload_buffer.json")) {
            try {
              const payloadContent = fs.readFileSync("payload_buffer.json", "utf8").trim();
              if (payloadContent && payloadContent !== "null") {
                const eventPayload = JSON.parse(payloadContent);
                if (eventPayload && eventPayload.logs && Array.isArray(eventPayload.logs)) {
                  historyData.total_pulses_recorded += eventPayload.logs.length;
                  historyData.vital_signs.heartbeat_bpm = Math.floor(Math.random() * (28 - 22 + 1)) + 22;
                  historyData.history_logs = [...eventPayload.logs, ...historyData.history_logs].slice(0, 100);
                }
              }
            } catch(e) {}
            try { fs.unlinkSync("payload_buffer.json"); } catch(e) {}
          }

          fs.writeFileSync(historyFile, JSON.stringify(historyData, null, 2));

          console.log(B + "=========================================================================" + NC);
          console.log(BOLD + G + "  [EATHESEN CENTRAL LOG MONITOR REAL-TIME TERMINAL V3000-OMEGA]" + NC);
          console.log(B + "=========================================================================" + NC);
          console.log(BOLD + Y + " [ DIGITAL LIVING ENTITY VITAL SIGNS ]" + NC);
          console.log(G + " STATUS: " + NC + BOLD + historyData.vital_signs.status + NC + " | " + G + "ENTROPY: " + NC + historyData.vital_signs.entropy);
          console.log(B + " HEARTBEAT: " + NC + historyData.vital_signs.heartbeat_bpm + " BPM | " + PUR + "COGNITION: " + NC + historyData.vital_signs.cognitive_level);
          console.log(B + " TOTAL PULSES RECORDED: " + NC + BOLD + historyData.total_pulses_recorded + NC);
          console.log(B + "=========================================================================" + NC);
          console.log(BOLD + G + " >>> LIVE F12 TELEMETRY STREAM (REAL-TIME MEMORY) <<<" + NC);
          console.log(B + "-------------------------------------------------------------------------" + NC);

          if (historyData.history_logs.length > 0) {
            historyData.history_logs.slice(0, 15).forEach((item, idx) => {
              console.log(PUR + "[" + item.time + "]" + NC + " " + G + "PULSE #" + (idx + 1) + ":" + NC + " " + B + item.log + NC);
            });
          } else {
            console.log(Y + "SYSTEM STANDBY: Waiting for client F12 pulse from index.html..." + NC);
          }

          console.log(B + "=========================================================================" + NC);
          EOF
          )
          node -e "$NODE_CODE"

      - name: Auto-Compile .eseb to .ehc
        run: |
          NODE_COMPILE=$(cat << 'EOF'
          const fs = require("fs");
          if (fs.existsSync("Protocols/Log_Live_Monitor.eseb")) {
            const esebContent = fs.readFileSync("Protocols/Log_Live_Monitor.eseb", "utf8");
            const match = esebContent.match(/return \`([\s\S]*?)\`;/);
            if (match) {
              const ehcCode = match[1]
                .replace(/\${this\.config\.stamp}/g, "V-STAMP-24")
                .replace(/\${this\.config\.bufferInterval}/g, "5000");
              
              if (!fs.existsSync("Protocols")) { fs.mkdirSync("Protocols"); }
              fs.writeFileSync("Protocols/Log_Live_Monitor.ehc", ehcCode);
              console.log("SUCCESS: Generated Protocols/Log_Live_Monitor.ehc");
            }
          }
          EOF
          )
          node -e "$NODE_COMPILE"

      - name: Safe Auto-Commit & Push (Strict ESEB State)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add LOG_HISTORY.json Protocols/Log_Live_Monitor.ehc || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "ESEB-LIVING-ENTITY: Sync Vital Signs & F12 Memory [V-STAMP-24]"
            git set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" || true
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          else
            echo "No state mutations detected. Zero entropy preserved."
          fi
