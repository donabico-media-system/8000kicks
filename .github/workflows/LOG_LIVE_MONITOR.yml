name: LOG_LIVE_MONITOR

on:
  push:
    paths:
      - 'Protocols/Log_Live_Monitor.eseb'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-log-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile ESEB Multi-Protocol Kernel
        run: |
          python3 Protocols/Log_Live_Monitor.eseb

      - name: Execute Groq LPU Real AI REST Renderer
        env:
          ESEB_CLASSIC_TOKEN: ${{ secrets.ESEB_CLASSIC_TOKEN }}
          API_GROQ_TOKEN: ${{ secrets.API_GROQ_TOKEN }}
        run: |
          node Protocols/Log_Live_Monitor_Renderer.js

      - name: Force Commit & Push HUD Artifacts
        run: |
          git config --global user.name "donabico-media-system[bot]"
          git config --global user.email "bot@donabico.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Stage toàn bộ các tệp được cập nhật ở Root và thư mục Protocols/
          git add -A
          
          if git diff --cached --quiet; then
            echo "No changes detected in repository. Entropy delta = 0."
          else
            git commit -m "chore(eseb-hud): auto-sync 6th-gen fighter cockpit telemetry & groq lpu ai report [skip ci]"
            
            # Giải quyết triệt để lỗi non-fast-forward bằng Rebase
            git fetch origin main
            git rebase origin/main || git rebase --skip || true
            
            # Push an toàn tuyệt đối lên nhánh main
            git push origin HEAD:main
          fi
