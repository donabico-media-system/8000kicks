name: LOG_LIVE_MONITOR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Protocols/Log_Live_Monitor.eseb'
      - '.github/workflows/LOG_LIVE_MONITOR.yml'
  repository_dispatch:
    types: [eseb_f12_log_stream]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  display-f12-live-terminal:
    name: "Render Real-Time F12 Log Terminal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-Compile .eseb to .ehc
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("Protocols/Log_Live_Monitor.eseb")) {
              const esebContent = fs.readFileSync("Protocols/Log_Live_Monitor.eseb", "utf8");
              const match = esebContent.match(/return \`([\s\S]*?)\`;/);
              if (match) {
                const ehcCode = match[1]
                  .replace(/\${this\.config\.stamp}/g, "V-STAMP-24")
                  .replace(/\${this\.config\.bufferInterval}/g, "5000");
                
                if (!fs.existsSync("Protocols")) { fs.mkdirSync("Protocols"); }
                fs.writeFileSync("Protocols/Log_Live_Monitor.ehc", ehcCode);
                console.log("SUCCESS: Generated Protocols/Log_Live_Monitor.ehc");
              }
            }
          '

      - name: Auto-Commit & Push Bundle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add Protocols/Log_Live_Monitor.ehc || true
          git diff-index --quiet HEAD || git commit -m "ESEB-AUTOBUILD: Regenerate Log_Live_Monitor.ehc [V-STAMP-24]"
          git push || true

      - name: Render Real-Time F12 Log Terminal Display
        run: |
          G='\033[0;32m'
          B='\033[0;36m'
          Y='\033[1;33m'
          PUR='\033[0;35m'
          NC='\033[0m'

          echo -e "${B}=========================================================================${NC}"
          echo -e "${G}  ESEB DYNAMIC LIVING ENGINE - CENTRAL LOG MONITOR REAL-TIME TERMINAL   ${NC}"
          echo -e "  STAMP: ${Y}V-STAMP-24${NC} | ANCHOR: ${G}¢24${NC} | ENTROPY: ${B}0.00000000000000${NC}"
          echo -e "  BRAND: ${PUR}DONABICO GLOBAL MEDIA SYSTEM${NC}"
          echo -e "${B}=========================================================================${NC}"
          echo -e "STATUS: ${G}HOOK ACTIVE - CAPTURING ALL PROTOCOL LOGS LIVE${NC}"
          echo -e "TIMESTAMP: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo -e "${B}=========================================================================${NC}"
          
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo -e "${G}>>> [LIVE TELEMETRY STREAM RECEIVED FROM CLIENT F12 LOGS] <<<${NC}"
            echo '${{ toJson(github.event.client_payload) }}' | node -e '
              const fs = require("fs");
              const input = fs.readFileSync(0, "utf-8");
              try {
                const payload = JSON.parse(input);
                console.log("\x1b[36mRepository:\x1b[0m " + payload.repo + " | \x1b[33mStamp:\x1b[0m " + payload.stamp);
                console.log("\x1b[32mTotal Log Items:\x1b[0m " + payload.total_logs);
                console.log("-------------------------------------------------------------------------");
                if (payload.logs && Array.isArray(payload.logs)) {
                  payload.logs.forEach((item, index) => {
                    console.log("\x1b[35m[" + item.time + "]\x1b[0m \x1b[32mLOG #" + (index + 1) + ":\x1b[0m \x1b[36m" + item.log + "\x1b[0m");
                  });
                }
              } catch(e) {
                console.log(input);
              }
            '
          else
            echo -e "${Y}SYSTEM HEALTHCHECK: F12 Telemetry Hub Standby & Ready.${NC}"
          fi
          echo -e "${B}=========================================================================${NC}"
