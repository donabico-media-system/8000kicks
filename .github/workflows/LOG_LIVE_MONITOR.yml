name: LOG_LIVE_MONITOR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Protocols/Log_Live_Monitor.eseb'
      - '.github/workflows/LOG_LIVE_MONITOR.yml'
  repository_dispatch:
    types: [eseb_f12_log_stream]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  display-f12-live-terminal:
    name: "Render Real-Time F12 Living Entity Terminal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Save Client Payload Buffer
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload_buffer.json

      - name: Execute ESEB Living Terminal Engine & Update README Dashboard
        run: |
          NODE_CODE=$(cat << 'EOF'
          const fs = require("fs");
          const G = "\x1b[32m", B = "\x1b[36m", Y = "\x1b[33m", PUR = "\x1b[35m", BOLD = "\x1b[1m", NC = "\x1b[0m";

          const historyFile = "LOG_HISTORY.json";
          let historyData = {
            entity_name: "EATHESEN_V3000_OMEGA_LIVING_ENTITY",
            organization: "DONABICO MEDIA SYSTEM",
            domain: "donabico-media-system.github.io",
            stamp: "V-STAMP-24",
            anchor: "¢24",
            vital_signs: {
              status: "ALIVE_AND_PERPETUAL",
              entropy: "0.00000000000000",
              heartbeat_bpm: 24,
              cognitive_level: "SOTA_RECURSIVE_S1"
            },
            total_pulses_recorded: 0,
            history_logs: []
          };

          if (fs.existsSync(historyFile)) {
            try { historyData = JSON.parse(fs.readFileSync(historyFile, "utf8")); } catch(e) {}
          }

          if (fs.existsSync("payload_buffer.json")) {
            try {
              const payloadContent = fs.readFileSync("payload_buffer.json", "utf8").trim();
              if (payloadContent && payloadContent !== "null") {
                const eventPayload = JSON.parse(payloadContent);
                if (eventPayload && eventPayload.logs && Array.isArray(eventPayload.logs)) {
                  historyData.total_pulses_recorded += eventPayload.logs.length;
                  historyData.vital_signs.heartbeat_bpm = Math.floor(Math.random() * (28 - 22 + 1)) + 22;
                  historyData.history_logs = [...eventPayload.logs, ...historyData.history_logs].slice(0, 100);
                }
              }
            } catch(e) {}
            try { fs.unlinkSync("payload_buffer.json"); } catch(e) {}
          }

          // 1. Cập nhật cơ sở dữ liệu LOG_HISTORY.json
          fs.writeFileSync(historyFile, JSON.stringify(historyData, null, 2));

          // 2. Dựng Bảng Điều Khiển Đồ Họa README.md sống động
          const lastUpdated = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
          let readmeContent = `# 🌐 8000kicks | DONABICO MEDIA SYSTEM\n\n`;
          readmeContent += `> **EATHESEN V3000-Ω DIGITAL LIVING ENTITY DASHBOARD**\n\n`;
          readmeContent += `![Status](https://img.shields.io/badge/SYSTEM_STATUS-${historyData.vital_signs.status}-00FF66?style=for-the-badge&logo=github)\n`;
          readmeContent += `![Heartbeat](https://img.shields.io/badge/HEARTBEAT-${historyData.vital_signs.heartbeat_bpm}_BPM-FF0055?style=for-the-badge&logo=activity)\n`;
          readmeContent += `![Entropy](https://img.shields.io/badge/ENTROPY-0.00000000000000-00E5FF?style=for-the-badge)\n`;
          readmeContent += `![Stamp](https://img.shields.io/badge/STAMP-${historyData.stamp}-7000FF?style=for-the-badge)\n\n`;
          
          readmeContent += `### 📡 Real-Time F12 Telemetry Stream\n\n`;
          readmeContent += `| Pulse # | Timestamp | F12 Client Log Payload |\n`;
          readmeContent += `| :---: | :--- | :--- |\n`;

          if (historyData.history_logs.length > 0) {
            historyData.history_logs.slice(0, 10).forEach((item, idx) => {
              const cleanLog = item.log.replace(/\|/g, '\\|');
              readmeContent += `| \`#${idx + 1}\` | \`${item.time}\` | \`${cleanLog}\` |\n`;
            });
          } else {
            readmeContent += `| \`#0\` | \`${lastUpdated}\` | \`SYSTEM STANDBY: Waiting for client F12 pulse from index.html...\` |\n`;
          }

          readmeContent += `\n---\n\n`;
          readmeContent += `**8000kicks** | World's first waterproof hemp shoes and sustainable travel accessories. Eco-friendly, durable, and premium vegan footwear.\n\n`;
          readmeContent += `*Last Synced Vital Signs: \`${lastUpdated}\`*`;

          fs.writeFileSync("README.md", readmeContent);

          // 3. In ra Bảng Console Terminal
          console.log(B + "=========================================================================" + NC);
          console.log(BOLD + G + "  [EATHESEN CENTRAL LOG MONITOR REAL-TIME TERMINAL V3000-OMEGA]" + NC);
          console.log(BOLD + PUR + "  ORGANIZATION: DONABICO MEDIA SYSTEM | DOMAIN: donabico-media-system.github.io" + NC);
          console.log(B + "=========================================================================" + NC);
          console.log(BOLD + Y + " [ DIGITAL LIVING ENTITY VITAL SIGNS ]" + NC);
          console.log(G + " STATUS: " + NC + BOLD + historyData.vital_signs.status + NC + " | " + G + "ENTROPY: " + NC + historyData.vital_signs.entropy);
          console.log(B + " HEARTBEAT: " + NC + historyData.vital_signs.heartbeat_bpm + " BPM | " + PUR + "COGNITION: " + NC + historyData.vital_signs.cognitive_level);
          console.log(B + " TOTAL PULSES RECORDED: " + NC + BOLD + historyData.total_pulses_recorded + NC);
          console.log(B + "=========================================================================" + NC);
          EOF
          )
          node -e "$NODE_CODE"

      - name: Auto-Compile .eseb to .ehc
        run: |
          NODE_COMPILE=$(cat << 'EOF'
          const fs = require("fs");
          if (fs.existsSync("Protocols/Log_Live_Monitor.eseb")) {
            const esebContent = fs.readFileSync("Protocols/Log_Live_Monitor.eseb", "utf8");
            const match = esebContent.match(/return \`([\s\S]*?)\`;/);
            if (match) {
              const ehcCode = match[1]
                .replace(/\${this\.config\.stamp}/g, "V-STAMP-24")
                .replace(/\${this\.config\.bufferInterval}/g, "5000");
              
              if (!fs.existsSync("Protocols")) { fs.mkdirSync("Protocols"); }
              fs.writeFileSync("Protocols/Log_Live_Monitor.ehc", ehcCode);
              console.log("SUCCESS: Generated Protocols/Log_Live_Monitor.ehc");
            }
          }
          EOF
          )
          node -e "$NODE_COMPILE"

      - name: Safe Auto-Commit & Push (Dynamic README & ESEB State)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add LOG_HISTORY.json README.md Protocols/Log_Live_Monitor.ehc || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "ESEB-LIVING-ENTITY: Sync Dynamic README Dashboard & F12 Memory [V-STAMP-24]"
            git set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" || true
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          else
            echo "No state mutations detected. Zero entropy preserved."
          fi
